<!DOCTYPE html>
<html lang="ko" class="watch-doc">
<head>
<script>
(function () {
  var root = document.documentElement;
  root.className += (root.className ? ' ' : '') + 'auth-wait';
})();
</script>
<style>html,body{background:#0f0f0f}html.auth-wait .wrap,html.auth-wait .loading-curtain,html.need-pin .wrap,html.need-pin .loading-curtain{display:none!important}html.auth-wait .pin-mask{display:none!important}html.need-pin .pin-mask{display:flex!important}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>재생 — Tesla Video Drive</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/app.css?v=179">
<style>html, body { overflow-anchor: none; }</style>
</head>
<body class="watch-loading">
<div id="loadingCurtain" class="loading-curtain on" aria-hidden="true"></div>
<div class="wrap" id="page">
  <div id="playerBox" class="player-box">
    <div class="stage-wrap" style="background:#000">
      <canvas id="stage" style="background:#000"></canvas>
      <div class="stage-loading-bg on" id="stageLoadingBg" aria-hidden="true"></div>
      <img class="stage-frame" id="stageFrame" alt="">
      <div class="tap-layer" id="tapLayer"></div>
      <div class="skip-flash skip-back" id="skipBack" aria-hidden="true"><span>-10초</span></div>
      <div class="skip-flash skip-fwd" id="skipFwd" aria-hidden="true"><span>+10초</span></div>
      <button class="tap-icon" id="tapIcon" type="button" aria-label="일시정지">
        <svg class="ico ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
        <svg class="ico ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
      </button>
      <div class="hud-top">
        <button class="hud-back" id="btnWatchBack" type="button" aria-label="뒤로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="hud-title" id="npTitle">불러오는 중...</div>
        <div class="hud-fps" id="npFps">0 FPS</div>
      </div>
      <div class="stage-status" id="stageStatus" aria-live="polite"></div>
      <div class="stage-loader" id="stageLoader" aria-hidden="true"><span></span></div>
      <div class="stage-repeat" id="stageRepeat" aria-live="polite" aria-label="반복 재생 대기">
        <span class="stage-repeat-icon" aria-hidden="true"></span><strong id="stageRepeatCount">3</strong>
        <span class="stage-repeat-label" id="stageRepeatLabel">다음 영상 재생</span>
      </div>
    </div>
    <div class="bar-bottom">
      <div class="seek-wrap" id="seekWrap">
        <div class="seek-track">
          <div class="seek-buf" id="seekBuf"></div>
          <div class="seek-play" id="seekPlay"></div>
        </div>
        <div class="seek-knob" id="seekKnob"></div>
        <input id="seek" class="seek-hit" type="range" min="0" max="1000" value="0">
      </div>
      <div class="bar-main">
        <div class="bar-group">
          <button class="ctrl icon play" id="btnPause" type="button" aria-label="일시정지">
            <svg class="ico ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
            <svg class="ico ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
          </button>
          <button class="ctrl icon" id="btnFromStart" type="button" aria-label="처음부터">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          <button class="ctrl" id="btnBack" type="button">-10</button>
          <button class="ctrl" id="btnFwd" type="button">+10</button>
          <button class="ctrl is-off" id="btnPrevVid" type="button" aria-disabled="true">이전재생</button>
          <button class="ctrl" id="btnNextVid" type="button">다음재생</button>
          <button class="ctrl icon" id="btnRepeat" type="button" aria-label="반복재생" aria-pressed="false">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          </button>
          <span class="time" id="npTime">0:00</span>
        </div>
        <div class="bar-group">
          <span class="vol-wrap">
            <button class="vol-ico" id="btnMute" type="button">♪</button>
            <input id="vol" class="vol" type="range" min="0" max="100" value="100">
          </span>
          <button class="ctrl fs" id="btnFs" type="button" aria-label="전체화면">
            <svg class="fs-ico fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <svg class="fs-ico fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
          </button>
        </div>
      </div>
      <div class="bar-main bar-opts">
        <div class="bar-group">
          <span class="bar-lab">화질</span>
          <span class="bar-seg">
            <button class="ctrl qbtn on" data-q="360" type="button">360</button>
            <button class="ctrl qbtn" data-q="480" type="button">480</button>
            <button class="ctrl qbtn" data-q="720" type="button">720</button>
          </span>
          <button class="autoplay-toggle" id="btnAutoQuality" type="button" role="switch" aria-label="자동 화질" aria-checked="false" aria-pressed="false">
            <span class="autoplay-label">자동 화질</span>
            <span class="autoplay-switch" aria-hidden="true"><span class="autoplay-knob"></span></span>
          </button>
          <button class="autoplay-toggle" id="btnAutoplay" type="button" role="switch" aria-label="다음 자동 재생" aria-checked="false" aria-pressed="false">
            <span class="autoplay-label">다음 자동 재생</span>
            <span class="autoplay-switch" aria-hidden="true">
              <span class="autoplay-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
              <span class="autoplay-knob"></span>
            </span>
          </button>
        </div>
        <div class="bar-group fs-pos">
          <span class="bar-lab">위치</span>
          <span class="bar-seg">
            <button class="ctrl abtn on" data-align="top" type="button">상단</button>
            <button class="ctrl abtn" data-align="center" type="button">가운데</button>
            <button class="ctrl abtn" data-align="bottom" type="button">하단</button>
          </span>
        </div>
      </div>
    </div>
  </div>
  <audio id="na" autoplay playsinline></audio>
  <div class="stat" id="st">영상을 불러오는 중...</div>
  <h1 class="watch-title" id="watchH">재생</h1>
  <p class="watch-meta" id="watchMeta"></p>
  <table class="ch-row" id="chRow" style="display:none">
    <tr>
      <td class="ch-av-td"><div class="ch-av" id="chAv"></div></td>
      <td class="ch-name-td"><span class="ch-name" id="chName"></span></td>
      <td class="ch-sub-td"><button class="sub-btn" id="btnSub" type="button">구독</button></td>
    </tr>
  </table>
  <section class="comments-box" id="commentsBox" style="display:none">
    <button class="comments-preview" id="commentsPreview" type="button">
      <span class="comments-preview-label">인기 댓글</span>
      <span class="comments-preview-text" id="commentsPreviewText">댓글을 불러오는 중...</span>
      <span class="comments-preview-arrow" aria-hidden="true">›</span>
    </button>
    <div class="comments-panel" id="commentsPanel" hidden>
      <div class="comments-head">
        <strong>댓글</strong>
        <div class="comments-head-actions">
          <button class="comment-sort on" data-comment-sort="top" aria-pressed="true" type="button">인기순</button>
          <button class="comment-sort" data-comment-sort="top-asc" aria-pressed="false" type="button">비인기순</button>
          <button class="comment-sort" data-comment-sort="new" aria-pressed="false" type="button">최신순</button>
          <button class="comment-sort" data-comment-sort="new-asc" aria-pressed="false" type="button">과거순</button>
          <button class="comments-close" id="commentsClose" type="button" aria-label="댓글 닫기">닫기</button>
        </div>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <div class="comments-state" id="commentsState"></div>
    </div>
  </section>

  <div class="yt-top">
    <div class="yt-top-right">
      <button class="back" id="btnWatchReload" type="button">새로고침</button>
      <button class="back js-logout" id="btnLogout" type="button">로그아웃</button>
      <button class="star-btn watch-star" id="btnFavWatch" type="button" aria-label="즐겨찾기" data-star="">
        <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 2.4l2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 19.2 6.6 19.2l1-6.1L3.2 8.8l6.1-.9z"/></svg>
      </button>
    </div>
    <div class="yt-top-left">
      <button class="brand yt-home" id="btnYtHome" type="button">
        <span class="yt-logo" aria-hidden="true"><svg viewBox="0 0 28 20"><rect width="28" height="20" rx="6" fill="#FF0000"/><polygon points="11,5 20,10 11,15" fill="#fff"/></svg></span>
        <span class="yt-word">YouTube</span>
      </button>
    </div>
    <div class="yt-top-search watch-search">
      <input class="inp" id="qWatch" placeholder="검색" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button class="btn" id="btnWatchSearch" type="button">검색</button>
    </div>
  </div>

  <button class="btn btn-red bot-help-btn" id="btnBotHelp" type="button" style="display:none">조치 방법 보기</button>
  <div class="chips" id="chips">
    <button class="lib-filter-btn" id="btnLibFilter" type="button" aria-expanded="false" aria-controls="libSorts" aria-label="필터">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5h18l-7 8.1V19l-4 2v-7.9L3 5z"/></svg>
    </button>
    <button class="lib-filter-btn" id="btnListRefresh" type="button" aria-label="목록 새로고침" title="목록 새로고침">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.17 4.88A8.8 8.8 0 1 1 8.14 4.09L7.33 2.88L14.26 2.5L9.69 7.73L9.24 6.34A6.3 6.3 0 1 0 15.7 6.9Z"/></svg>
    </button>
    <button class="chip on" data-feed="suggest" type="button">추천 영상</button>
    <button class="chip" data-feed="related" type="button">채널 영상</button>
    <button class="chip" data-feed="search" type="button">검색</button>
    <button class="chip" data-feed="favs" type="button">즐겨찾기</button>
  </div>
  <div id="watchTabSearch" class="watch-tab-search" style="display:none">
    <input class="inp" id="qWatchTab" placeholder="검색" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="btn" id="btnWatchTabSearch" type="button">검색</button>
  </div>
  <h2 class="rel-h" id="relH" style="display:none">관련 동영상</h2>
  <div id="libTools" class="lib-tools" style="display:none">
    <div class="lib-sorts" id="libSorts">
      <button class="chip" data-sort="rec" type="button" style="display:none">추천순</button>
      <button class="chip on" data-sort="new" type="button">최신순</button>
      <button class="chip" data-sort="old" type="button">오래된</button>
      <button class="chip" data-sort="title" type="button">제목</button>
      <button class="chip" data-sort="views" type="button">조회수</button>
      <button class="chip" data-sort="dur" type="button">길이</button>
    </div>
  </div>
  <table class="feed-split watch-feed subs-on">
    <tr>
      <td class="subs-td" id="subsTd">
        <input class="inp subs-find" id="subsFind" placeholder="채널명으로 검색" autocomplete="off" autocorrect="off" spellcheck="false">
        <div class="subs-rail" id="subsRail"></div>
      </td>
      <td class="feed-td">
        <div class="feed-sub" id="feedSub" style="display:none">
          <span class="feed-sub-name" id="feedSubName"></span>
          <button class="sub-btn on" id="btnFeedSub" type="button">구독중</button>
        </div>
        <div class="yt-grid watch-list" id="list"></div>
        <button class="more-bar" id="moreBar" type="button" style="display:none">더 보기</button>
      </td>
    </tr>
  </table>
</div>

<div id="pinMask" class="pin-mask">
  <div class="pin-box">
    <h2>접속 PIN</h2>
    <div class="sub">허용된 PIN만 접속할 수 있습니다. PIN마다 구독·즐겨찾기가 따로 저장됩니다.</div>
    <div class="pin-dots" id="pinDots">PIN</div>
    <div id="pinErr" class="fail" style="min-height:24px;margin-top:6px;"></div>
    <div class="pin-grid">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="c">C</button><button data-k="0">0</button><button data-k="x">←</button>
    </div>
  </div>
</div>

<script>
(function () {
  var q = String(location.search || '');
  if (!/(?:^|[?&])m=1(?:&|$)/.test(q)) return;
  var st = document.getElementById('st');
  if (st) { st.textContent = '회원전용 영상입니다'; st.className = 'stat members'; }
  var ss = document.getElementById('stageStatus');
  if (ss) { ss.textContent = '회원전용 영상입니다'; ss.className = 'stage-status on members'; }
  var np = document.getElementById('npTitle');
  if (np) np.textContent = '회원전용 영상입니다';
  var curtain = document.getElementById('loadingCurtain');
  if (curtain) curtain.className = 'loading-curtain';
  var bg = document.getElementById('stageLoadingBg');
  if (bg) bg.className = 'stage-loading-bg';
  document.body.className = String(document.body.className || '').replace(/\bwatch-loading\b/, '').replace(/^\s+|\s+$/g, '');
})();
</script>
<script src="../config.js?v=133"></script>
<script src="../js/common.js?v=139"></script>
<script src="../js/jsmpeg.min.js?v=133"></script>
  <script src="../js/player.js?v=333"></script>
</body>
</html>
