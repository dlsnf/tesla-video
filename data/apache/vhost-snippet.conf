# 아래 블록을 /etc/httpd/conf/httpd.conf 의
#   <VirtualHost *:80>
#       ServerName example.com
# 안, Alias /invitation 설정 바로 아래에 붙여 넣으세요.
# Alias /tv 는 쓰지 마세요. 이 프로젝트는 PHP 폴더가 아니라 Docker 프록시입니다.

    # ===== Tesla Video Drive : http://example.com/tv/ =====
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300

    RedirectMatch ^/tv$ /tv/

    ProxyPass        /tv/ws/  ws://127.0.0.1:8742/ws/
    ProxyPassReverse /tv/ws/  ws://127.0.0.1:8742/ws/

    ProxyPass        /tv/     http://127.0.0.1:8742/
    ProxyPassReverse /tv/     http://127.0.0.1:8742/
    # ========================================================
