# Tesla Video Drive
# 이 파일은 /etc/httpd/conf.d/tesla-video.conf 로 복사합니다.
# IncludeOptional conf.d/*.conf 가 VirtualHost 보다 먼저 읽히므로
# 여기서는 "정적 파일로 프로젝트 폴더가 노출되지 않게" 만 막습니다.
#
# /tv URL 프록시는 반드시 example.com VirtualHost 안에 넣으세요.
# 붙여 넣을 내용은 apache/vhost-snippet.conf 를 보세요.

<Directory "/var/www/html/tv">
    Options None
    AllowOverride None
    Require all denied
</Directory>
