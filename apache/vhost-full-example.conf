# 참고용. 실제 /etc/httpd/conf/httpd.conf 의 "2번 사이트: example.com"
# VirtualHost 가 이렇게 보이면 됩니다. 기존 invitation Alias 는 그대로 둡니다.

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    DocumentRoot /var/www/html/site

    <Directory /var/www/html/site>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /invitation /var/www/html/invitation

    <Directory /var/www/html/invitation>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ===== Tesla Video Drive : http://example.com/tv/ =====
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300

    RedirectMatch ^/tv$ /tv/

    ProxyPass        /tv/ws/  ws://127.0.0.1:8742/ws/
    ProxyPassReverse /tv/ws/  ws://127.0.0.1:8742/ws/

    ProxyPass        /tv/     http://127.0.0.1:8742/
    ProxyPassReverse /tv/     http://127.0.0.1:8742/
    # ========================================================
</VirtualHost>
